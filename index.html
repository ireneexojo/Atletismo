<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tiempos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC20hdEsrcGjCdfrGZ1bQKaQI1dAULZUaY",
            authDomain: "atletismo-27061.firebaseapp.com",
            projectId: "atletismo-27061",
            storageBucket: "atletismo-27061.firebasestorage.app",
            messagingSenderId: "4223238228",
            appId: "1:4223238228:web:59947fced3c5feca9aadc1",
            measurementId: "G-C7SRZLBCRY"
        };

        let auth, db;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Error al inicializar Firebase:", e);
        }

        let currentUser = null;
        let userSettings = {
            baseDistance: 100,
            baseTime: 13.05,
            distances: [30, 40, 50, 60, 80, 100, 120, 150, 180, 200, 250, 300, 350, 400]
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;

                await loadUserData(user.uid);
                renderViews();
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        window.handleRegister = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert("Por favor, introduce email y contraseña.");
                return;
            }

            if (password.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                alert("¡Usuario registrado con éxito!");
                await saveUserData(res.user.uid);
            } catch (err) {
                alert("Error en el registro: " + err.message);
            }
        };

        window.handleLogin = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert("Por favor, introduce email y contraseña.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert("Error al iniciar sesión: " + err.message);
            }
        };

        window.handleLogout = () => {
            signOut(auth);
        };

        async function loadUserData(uid) {
            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    userSettings = docSnap.data();
                    document.getElementById('baseDistance').value = userSettings.baseDistance;
                    document.getElementById('baseTime').value = userSettings.baseTime;
                } else {
                    await saveUserData(uid);
                }
            } catch (err) {
                console.error("Error cargando datos:", err);
            }
        }

        async function saveUserData(uid = currentUser?.uid) {
            if (!uid) return;
            const baseDist = parseFloat(document.getElementById('baseDistance').value) || 100;
            const baseT = parseFloat(document.getElementById('baseTime').value) || 13.05;

            userSettings.baseDistance = baseDist;
            userSettings.baseTime = baseT;

            try {
                await setDoc(doc(db, "users", uid), userSettings);
                renderViews();
            } catch (err) {
                console.error("Error al guardar datos:", err);
            }
        }

        window.updateSettings = () => saveUserData();

        window.addDistance = () => {
            const val = parseFloat(document.getElementById('newDistance').value);
            if (val && !userSettings.distances.includes(val)) {
                userSettings.distances.push(val);
                userSettings.distances.sort((a, b) => a - b);
                document.getElementById('newDistance').value = '';
                saveUserData();
            }
        };

        window.removeDistance = (dist) => {
            userSettings.distances = userSettings.distances.filter(d => d !== dist);
            saveUserData();
        };

        function formatTime(seconds) {
            return seconds < 60
                ? seconds.toFixed(2) + 's'
                : `${Math.floor(seconds / 60)}:${(seconds % 60).toFixed(2).padStart(5, '0')}s`;
        }

        function renderViews() {
            const baseDist = userSettings.baseDistance;
            const baseT = userSettings.baseTime;
            const percentages = [100, 95, 90, 85, 80, 75, 70, 65, 60];

            // 1. Renderizar Vista Móvil (Tarjetas)
            const mobileContainer = document.getElementById('mobile-cards-container');
            mobileContainer.innerHTML = '';

            // 2. Renderizar Vista Escritorio (Tabla)
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            userSettings.distances.forEach(d => {
                // Exponente de fatiga (1.08 es ideal para transferir de sprints a distancias mayores)
                const m = 1.08; 
                const time100 = baseT * Math.pow(d / baseDist, m);
                const isBase = d === baseDist;

                // --- VISTA MÓVIL (Tarjeta) ---
                const card = document.createElement('div');
                card.className = `p-4 rounded-lg border shadow-sm ${isBase ? 'bg-blue-50 border-blue-300' : 'bg-white border-gray-200'}`;
                
                let cardHtml = `
                    <div class="flex justify-between items-center mb-3 border-b pb-2">
                        <span class="text-lg font-bold ${isBase ? 'text-blue-700' : 'text-gray-800'}">${d} metros ${isBase ? '(Base)' : ''}</span>
                        <button onclick="removeDistance(${d})" class="text-red-500 hover:text-red-700 font-bold px-2">✕</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                `;

                percentages.forEach(pct => {
                    const timeSec = time100 / (pct / 100);
                    cardHtml += `
                        <div class="bg-gray-100 p-2 rounded">
                            <div class="text-xs text-gray-500 font-semibold">${pct}%</div>
                            <div class="text-sm font-bold text-gray-800">${formatTime(timeSec)}</div>
                        </div>
                    `;
                });

                cardHtml += `</div>`;
                card.innerHTML = cardHtml;
                mobileContainer.appendChild(card);

                // --- VISTA ESCRITORIO (Fila de Tabla) ---
                const tr = document.createElement('tr');
                let rowHtml = `<td class="p-3 border text-center font-bold ${isBase ? 'bg-blue-100 text-blue-700' : ''}">
                    ${d}m 
                    <button onclick="removeDistance(${d})" class="ml-2 text-red-500 hover:text-red-700 font-normal">✕</button>
                </td>`;

                percentages.forEach(pct => {
                    const timeSec = time100 / (pct / 100);
                    rowHtml += `<td class="p-3 border text-center text-sm ${pct === 100 ? 'font-semibold bg-gray-50' : ''}">${formatTime(timeSec)}</td>`;
                });

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }
    </script>
</head>

<body class="bg-gray-100 p-3 sm:p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- SECCIÓN 1: Autenticación -->
        <div id="auth-section" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-6">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Acceso Usuarios</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" class="w-full mt-1 p-2 border rounded-md" placeholder="atleta@deporte.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="password" class="w-full mt-1 p-2 border rounded-md" placeholder="••••••••">
                </div>
                <div class="flex gap-2">
                    <button onclick="handleLogin()" class="w-1/2 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Iniciar Sesión</button>
                    <button onclick="handleRegister()" class="w-1/2 bg-gray-600 text-white py-2 rounded-md hover:bg-gray-700">Registrarse</button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: Aplicación Principal -->
        <div id="app-section" class="hidden space-y-4 sm:space-y-6">
            <!-- Barra superior -->
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow">
                <div class="text-sm sm:text-base">
                    <span class="text-gray-600 hidden sm:inline">Usuario:</span>
                    <strong id="user-email" class="text-blue-600"></strong>
                </div>
                <button onclick="handleLogout()" class="bg-red-500 text-white px-3 py-1.5 sm:px-4 sm:py-2 text-sm rounded-md hover:bg-red-600">Salir</button>
            </div>

            <!-- Panel de Controles -->
            <div class="bg-white p-4 sm:p-6 rounded-lg shadow space-y-4">
                <h3 class="text-base sm:text-lg font-bold text-gray-800">Ajustes de Marca Base</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
                    <div>
                        <label class="block text-xs sm:text-sm text-gray-600">Distancia Base (m)</label>
                        <input type="number" id="baseDistance" value="100" onchange="updateSettings()" class="w-full p-2 border rounded-md text-sm">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm text-gray-600">Tiempo Base (s)</label>
                        <input type="number" step="0.01" id="baseTime" value="13.05" onchange="updateSettings()" class="w-full p-2 border rounded-md text-sm">
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm text-gray-600">Añadir Distancia (m)</label>
                        <div class="flex gap-2">
                            <input type="number" id="newDistance" class="w-full p-2 border rounded-md text-sm" placeholder="Ej. 70">
                            <button onclick="addDistance()" class="bg-green-600 text-white px-3 py-2 rounded-md hover:bg-green-700 text-sm">Añadir</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VISTA MÓVIL: Tarjetas (Se muestra solo en móviles) -->
            <div id="mobile-cards-container" class="space-y-3 md:hidden"></div>

            <!-- VISTA ESCRITORIO: Tabla (Se muestra solo en pantallas medianas/grandes) -->
            <div class="hidden md:block bg-white rounded-lg shadow overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-white">
                            <th class="p-3 border">Dist.</th>
                            <th class="p-3 border">100%</th>
                            <th class="p-3 border">95%</th>
                            <th class="p-3 border">90%</th>
                            <th class="p-3 border">85%</th>
                            <th class="p-3 border">80%</th>
                            <th class="p-3 border">75%</th>
                            <th class="p-3 border">70%</th>
                            <th class="p-3 border">65%</th>
                            <th class="p-3 border">60%</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tiempos - Con Usuarios</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Import the functions you need from the SDKs you need
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyC20hdEsrcGjCdfrGZ1bQKaQI1dAULZUaY",
            authDomain: "atletismo-27061.firebaseapp.com",
            projectId: "atletismo-27061",
            storageBucket: "atletismo-27061.firebasestorage.app",
            messagingSenderId: "4223238228",
            appId: "1:4223238228:web:59947fced3c5feca9aadc1",
            measurementId: "G-C7SRZLBCRY"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Estado Global
        let currentUser = null;
        let userSettings = {
            baseDistance: 100,
            baseTime: 13.05,
            distances: [30, 40, 50, 60, 80, 100, 120, 150, 180, 200, 250, 300, 350, 400]
        };

        // Escuchar Estado de Autenticación
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = user.email;

                // Cargar datos del usuario desde Firestore
                await loadUserData(user.uid);
                renderTable();
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        });

        // Autenticación: Registro
        window.handleRegister = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                // Guardar valores por defecto al registrarse
                await saveUserData(res.user.uid);
            } catch (err) {
                alert("Error al registrar: " + err.message);
            }
        };

        // Autenticación: Login
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (err) {
                alert("Error al iniciar sesión: " + err.message);
            }
        };

        // Autenticación: Logout
        window.handleLogout = () => {
            signOut(auth);
        };

        // Cargar Datos de Firestore
        async function loadUserData(uid) {
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                userSettings = docSnap.data();
                document.getElementById('baseDistance').value = userSettings.baseDistance;
                document.getElementById('baseTime').value = userSettings.baseTime;
            } else {
                await saveUserData(uid);
            }
        }

        // Guardar Datos en Firestore
        async function saveUserData(uid = currentUser?.uid) {
            if (!uid) return;
            const baseDist = parseFloat(document.getElementById('baseDistance').value) || 100;
            const baseT = parseFloat(document.getElementById('baseTime').value) || 13.05;

            userSettings.baseDistance = baseDist;
            userSettings.baseTime = baseT;

            await setDoc(doc(db, "users", uid), userSettings);
            renderTable();
        }

        window.updateSettings = () => saveUserData();

        // Gestión de Distancias
        window.addDistance = () => {
            const val = parseFloat(document.getElementById('newDistance').value);
            if (val && !userSettings.distances.includes(val)) {
                userSettings.distances.push(val);
                userSettings.distances.sort((a, b) => a - b);
                document.getElementById('newDistance').value = '';
                saveUserData();
            }
        };

        window.removeDistance = (dist) => {
            userSettings.distances = userSettings.distances.filter(d => d !== dist);
            saveUserData();
        };

        // Renderizar Tabla
        function renderTable() {
            const baseDist = userSettings.baseDistance;
            const baseT = userSettings.baseTime;
            const percentages = [100, 95, 90, 85, 80, 75, 70, 65, 60];

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            userSettings.distances.forEach(d => {
                const tr = document.createElement('tr');
                const time100 = (d / baseDist) * baseT;
                const isBase = d === baseDist;

                let rowHtml = `<td class="p-3 border text-center font-bold ${isBase ? 'bg-blue-100 text-blue-700' : ''}">
                    ${d}m 
                    <button onclick="removeDistance(${d})" class="ml-2 text-red-500 hover:text-red-700 font-normal">✕</button>
                </td>`;

                percentages.forEach(pct => {
                    const timeSec = time100 / (pct / 100);
                    const formatted = timeSec < 60
                        ? timeSec.toFixed(2) + 's'
                        : `${Math.floor(timeSec / 60)}:${(timeSec % 60).toFixed(2).padStart(5, '0')}s`;

                    rowHtml += `<td class="p-3 border text-center text-sm ${pct === 100 ? 'font-semibold bg-gray-50' : ''}">${formatted}</td>`;
                });

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }
    </script>

<body class="bg-gray-100 p-4 font-sans">
    <div class="max-w-6xl mx-auto">
        <!-- SECCIÓN 1: Autenticación (Login / Registro) -->
        <div id="auth-section" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
            <h2 class="text-2xl font-bold mb-4 text-center text-gray-800">Acceso Usuarios</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" class="w-full mt-1 p-2 border rounded-md"
                        placeholder="atleta@deporte.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="password" class="w-full mt-1 p-2 border rounded-md"
                        placeholder="••••••••">
                </div>
                <div class="flex gap-2">
                    <button onclick="handleLogin()"
                        class="w-1/2 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Iniciar Sesión</button>
                    <button onclick="handleRegister()"
                        class="w-1/2 bg-gray-600 text-white py-2 rounded-md hover:bg-gray-700">Registrarse</button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN 2: Aplicación Principal (Protegida) -->
        <div id="app-section" class="hidden space-y-6">
            <!-- Barra superior del usuario -->
            <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow">
                <div>
                    <span class="text-gray-600">Sesión iniciada como:</span>
                    <strong id="user-email" class="text-blue-600 ml-1"></strong>
                </div>
                <button onclick="handleLogout()"
                    class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Cerrar Sesión</button>
            </div>

            <!-- Panel de Controles -->
            <div class="bg-white p-6 rounded-lg shadow space-y-4">
                <h3 class="text-lg font-bold text-gray-800">Ajustes de Marca Base</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600">Distancia Base (m)</label>
                        <input type="number" id="baseDistance" value="100" onchange="updateSettings()"
                            class="w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600">Tiempo Base (s)</label>
                        <input type="number" step="0.01" id="baseTime" value="13.05" onchange="updateSettings()"
                            class="w-full p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600">Añadir Distancia (m)</label>
                        <div class="flex gap-2">
                            <input type="number" id="newDistance" class="w-full p-2 border rounded-md"
                                placeholder="Ej. 70">
                            <button onclick="addDistance()"
                                class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Añadir</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de Tiempos -->
            <div class="bg-white rounded-lg shadow overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-gray-800 text-white">
                            <th class="p-3 border">Dist.</th>
                            <th class="p-3 border">100%</th>
                            <th class="p-3 border">95%</th>
                            <th class="p-3 border">90%</th>
                            <th class="p-3 border">85%</th>
                            <th class="p-3 border">80%</th>
                            <th class="p-3 border">75%</th>
                            <th class="p-3 border">70%</th>
                            <th class="p-3 border">65%</th>
                            <th class="p-3 border">60%</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tiempos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BARRA SUPERIOR DE USUARIO (Ocupa todo el ancho) -->
    <header id="user-header" class="user-header hidden">
        <div class="user-header-content">
            <div class="user-info">
                <span>Atleta:</span>
                <strong id="user-display-name">--</strong>
            </div>
            <button id="btn-logout" type="button" class="btn btn-danger btn-sm">Salir</button>
        </div>
    </header>

    <!-- PANTALLA DE AUTENTICACIÓN -->
    <section id="auth-section" class="auth-container">
        <div class="card auth-card">
            <h2>Acceso Usuarios</h2>
            
            <div class="form-group hidden" id="reg-username-container">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" placeholder="ej. atletagomez" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="identifier">Usuario o Email</label>
                <input type="text" id="identifier" placeholder="Usuario o atleta@deporte.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button id="btn-login" type="button" class="btn btn-primary btn-block">Iniciar Sesión</button>
            <button id="btn-register" type="button" class="btn btn-success btn-block hidden">Registrarse</button>

            <p id="toggle-msg" class="auth-toggle">
                ¿No tienes cuenta? <a href="#" id="link-show-register">Regístrate</a>
            </p>
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="app-section" class="app-container hidden">
        <!-- Panel de Controles -->
        <section class="card controls-card">
            <h3>Ajustes de Marca Base</h3>
            <div class="controls-grid">
                <div class="form-group">
                    <label for="baseDistance">Distancia Base (m)</label>
                    <input type="number" id="baseDistance" value="100">
                </div>
                <div class="form-group">
                    <label for="baseTime">Tiempo Base (s)</label>
                    <input type="number" id="baseTime" step="0.01" value="13.05">
                </div>
                <div class="form-group">
                    <label for="newDistance">Añadir Distancia (m)</label>
                    <div class="input-inline">
                        <input type="number" id="newDistance" placeholder="Ej. 70">
                        <button id="btn-add-distance" type="button" class="btn btn-success">Añadir</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Vista para Móviles (Tarjetas) -->
        <section id="mobile-cards-container" class="mobile-only"></section>

        <!-- Vista para Escritorio (Tabla) -->
        <section class="desktop-only card table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Dist.</th>
                            <th>100%</th>
                            <th>95%</th>
                            <th>90%</th>
                            <th>85%</th>
                            <th>80%</th>
                            <th>75%</th>
                            <th>70%</th>
                            <th>65%</th>
                            <th>60%</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Carga del script JS local como módulo -->
    <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO - Vista Previa de la App</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos temporales para el banner de modo prueba */
        .demo-banner {
            background-color: #fef08a;
            color: #854d0e;
            padding: 8px 16px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px solid #fde047;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="demo-banner">
        ⚠️ MODO PRUEBA / DEMO — Cambios visuales instantáneos sin Firebase ni Login
    </div>

    <!-- Barra de Sesión de Usuario -->
    <header class="user-header card">
        <div class="user-info">
            <span>¡ Hola, </span>
            <strong id="user-display-name">Atleta Demo</strong>
            <span>!</span>
        </div>
        <button type="button" class="btn-logout" onclick="alert('Botón salir (Modo Demo)')">Cerrar Sesión</button>
    </header>

    <div class="app-container">
        <main id="app-section">



            <!-- Panel de Controles -->
            <section class="card controls-card">
                <h3>Ajustes de Marca Base</h3>
                <div class="controls-grid">
                    <div class="form-group">
                        <label for="baseDistance">Distancia Base (m)</label>
                        <input type="number" id="baseDistance" value="100">
                    </div>
                    <div class="form-group">
                        <label for="baseTime">Tiempo Base (s)</label>
                        <input type="number" id="baseTime" step="0.01" value="13.05">
                    </div>
                    <div class="form-group">
                        <label for="newDistance">Añadir Distancia (m)</label>
                        <div class="input-inline">
                            <input type="number" id="newDistance" placeholder="Ej. 70">
                            <button id="btn-add-distance" type="button" class="btn btn-success">Añadir</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Vista Adaptativa para Móviles (Tarjetas) -->
            <section id="mobile-cards-container" class="mobile-only"></section>

            <!-- Vista Adaptativa para Escritorio (Tabla) -->
            <section class="desktop-only card table-card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Dist.</th>
                                <th>100%</th>
                                <th>95%</th>
                                <th>90%</th>
                                <th>85%</th>
                                <th>80%</th>
                                <th>75%</th>
                                <th>70%</th>
                                <th>65%</th>
                                <th>60%</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- Script en vivo para simular los cálculos sin Firebase -->
    <script>
        // Estado local simulado
        let demoSettings = {
            baseDistance: 100,
            baseTime: 13.05,
            distances: [30, 40, 50, 60, 80, 100, 120, 150, 180, 200, 250, 300, 350, 400]
        };

        const percentages = [100, 95, 90, 85, 80, 75, 70, 65, 60];
        const m = 1.08; // Exponente de fatiga

        function formatTime(seconds) {
            return seconds < 60
                ? seconds.toFixed(2) + 's'
                : `${Math.floor(seconds / 60)}:${(seconds % 60).toFixed(2).padStart(5, '0')}s`;
        }

        function renderDemo() {
            const baseDist = demoSettings.baseDistance;
            const baseT = demoSettings.baseTime;

            const mobileContainer = document.getElementById('mobile-cards-container');
            const tbody = document.getElementById('table-body');

            mobileContainer.innerHTML = '';
            tbody.innerHTML = '';

            demoSettings.distances.forEach(d => {
                const time100 = baseT * Math.pow(d / baseDist, m);
                const isBase = d === baseDist;

                // Tarjetas para móviles
                const card = document.createElement('div');
                card.className = `distance-card ${isBase ? 'is-base' : ''}`;

                let cardHtml = `
                    <div class="card-header">
                        <span>${d} metros ${isBase ? '(Base)' : ''}</span>
                        <button class="btn-icon-delete" onclick="removeDistance(${d})">✕</button>
                    </div>
                    <div class="card-metrics">
                `;

                percentages.forEach(pct => {
                    const timeSec = time100 / (pct / 100);
                    cardHtml += `
                        <div class="metric-box">
                            <div class="metric-pct">${pct}%</div>
                            <div class="metric-val">${formatTime(timeSec)}</div>
                        </div>
                    `;
                });

                cardHtml += `</div>`;
                card.innerHTML = cardHtml;
                mobileContainer.appendChild(card);

                // Tabla para escritorio
                const tr = document.createElement('tr');
                let rowHtml = `
                    <td class="${isBase ? 'is-base' : ''}">
                        ${d}m
                        <button class="btn-icon-delete" onclick="removeDistance(${d})">✕</button>
                    </td>
                `;

                percentages.forEach(pct => {
                    const timeSec = time100 / (pct / 100);
                    rowHtml += `<td>${formatTime(timeSec)}</td>`;
                });

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function removeDistance(dist) {
            demoSettings.distances = demoSettings.distances.filter(d => d !== dist);
            renderDemo();
        }

        // Eventos en vivo
        document.getElementById('baseDistance').addEventListener('input', (e) => {
            demoSettings.baseDistance = parseFloat(e.target.value) || 100;
            renderDemo();
        });

        document.getElementById('baseTime').addEventListener('input', (e) => {
            demoSettings.baseTime = parseFloat(e.target.value) || 13.05;
            renderDemo();
        });

        document.getElementById('btn-add-distance').addEventListener('click', () => {
            const input = document.getElementById('newDistance');
            const val = parseFloat(input.value);
            if (val && !demoSettings.distances.includes(val)) {
                demoSettings.distances.push(val);
                demoSettings.distances.sort((a, b) => a - b);
                input.value = '';
                renderDemo();
            }
        });

        // Inicializar renderizado
        renderDemo();
    </script>
</body>

</html>
